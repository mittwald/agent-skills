name: External links

# Checks external URLs in the docs. Runs on a schedule (not on PRs) so a dead or
# rate-limited third-party host never blocks a contributor's pull request. A
# failure opens (or updates) a tracking issue instead of a red build.
on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links-external:
    name: External links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Online run, governed by lychee.toml (timeouts, retries, excludes).
          # fail: false so we can surface results as an issue rather than a hard
          # failure on a scheduled run.
          args: "--no-progress ."
          fail: false

      - name: Open an issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Broken external links detected"
          content-filepath: ./lychee/out.md
          labels: |
            broken-links
            automated
